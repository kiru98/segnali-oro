name: Segnali oro

on:
  schedule:
    - cron: "7 * * * *"   # ogni ora, al minuto 7 (UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "Manda solo un messaggio di prova su Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: segnali-oro
  cancel-in-progress: false

jobs:
  segnali:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla le regole e invia i segnali
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITALE_EUR: ${{ vars.CAPITALE_EUR || '300' }}
          RISCHIO_PCT: ${{ vars.RISCHIO_PCT || '0.5' }}
          TEST_MESSAGE: ${{ inputs.test && '1' || '0' }}
        run: python segnali_oro.py

      - name: Salva lo stato
        run: |
          git config user.name "segnali-oro-bot"
          git config user.email "segnali-oro-bot@users.noreply.github.com"
          git add stato.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Aggiorna stato" && git push)
